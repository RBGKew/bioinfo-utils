site_name: "Kew Bioinformatics Documentation"
site_url: https://rbg-kew-bioinformatics-utils.readthedocs.io

theme: 
  name: readthedocs
  highlightjs: true

plugins: 
  - search
  - mkdocstrings:
      handelers:
        python:
          option:docstring_style: sphinx
markdown evtentions:
  - markdown_include.include:
      base_path: .
  - admonition


nav: 
  - Services:
    - Crop Diversity HPC : services/cropdiversityhpc.md
    - HPCstorage : services/hpcstorage.md
    - Remote Access: services/remote-access.md
    - SFTP : services/sftp-service.md
  - Tutorials:
    - Data Storage : tutorials/storage.md
    - File Permissions: tutorials/permissions.md
    - Slurm Jobs : tutorials/slurm.md
    - Memory Useage : tutorials/memory.md
    - Parallel Processing : tutorials/parallel.md
    - Linux VPN: tutorials/openconnect.md

